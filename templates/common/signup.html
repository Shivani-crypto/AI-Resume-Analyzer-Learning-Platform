<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up & Verify Email - AI Resume Analyzer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="dashboard-body" style="background: #f8fafc; color: #0f172a; min-height: 100vh;">
    <div class="app-container" style="max-width: 520px; margin: 3vh auto; padding: 0 16px;">
        <!-- Top Navigation -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <a href="/" class="btn-home-nav" style="display: inline-flex; align-items: center; gap: 8px; background: #0f172a; color: #ffffff; padding: 8px 16px; border-radius: 30px; font-weight: 700; font-size: 0.88rem; text-decoration: none;">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="/login" style="color: #0f172a; font-weight: 800; font-size: 0.92rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </a>
        </div>

        <header class="app-header small-header" style="text-align: center; margin-bottom: 1.5rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: #eff6ff; color: #2563eb; border-radius: 16px; font-size: 1.6rem; margin-bottom: 0.75rem; border: 1px solid #bfdbfe;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 style="color: #0f172a; font-weight: 800; font-size: 2.1rem; letter-spacing: -0.5px; margin: 0;">
                Create Your Account
            </h1>
            <p style="color: #475569; font-weight: 500; font-size: 0.95rem; margin-top: 6px;">
                Verify your email address via OTP to access AI Career Pro.
            </p>
        </header>

        <main>
            <section class="card glass-panel" style="background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); padding: 2rem;">
                
                <!-- Dynamic Status Alert Box -->
                <div id="alertBox" class="auth-alert-box" style="display: {% if error %}flex{% else %}none{% endif %};" class="{% if error %}auth-alert-error{% endif %}">
                    <i id="alertIcon" class="fa-solid {% if error %}fa-circle-exclamation{% else %}fa-circle-info{% endif %}"></i>
                    <span id="alertMsg">{% if error %}{{ error }}{% endif %}</span>
                </div>

                <form id="signupForm" action="/signup" method="POST" class="modern-form">

    <div class="input-group" style="margin-bottom: 1rem;">
        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            value="{{ full_name if full_name else '' }}"
            placeholder="e.g. Alex Morgan"
            required
        >
    </div>

    <div class="input-group" style="margin-bottom: 1rem;">
        <label>Email Address</label>
        <input
            type="email"
            name="email"
            value="{{ email if email else '' }}"
            placeholder="alex@example.com"
            required
        >
    </div>

    <div class="input-group" style="margin-bottom: 1rem;">
        <label>Phone Number</label>
        <input
            type="tel"
            name="ph_number"
            value="{{ ph_number if ph_number else '' }}"
            placeholder="+1 (555) 000-0000"
        >
    </div>

    <div class="input-group" style="margin-bottom: 1.5rem;">
        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create a secure password"
            required
            minlength="6"
        >
    </div>

    <button
        type="submit"
        id="btnSubmitForm"
        class="btn btn-primary w-full glow-btn"
    >
        <span>Create Account</span>
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</form>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="/login" style="color: #0f172a; font-weight: 800; font-size: 0.92rem; text-decoration: underline;">
                        Already registered? Log in here
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script>
        let currentGeneratedOtp = '';
        let countdownInterval = null;

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.className = 'fa-solid fa-eye-slash';
                    icon.style.color = '#2563eb';
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.className = 'fa-solid fa-eye';
                    icon.style.color = '#64748b';
                }
            }
        }

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alertBox');
            const msg = document.getElementById('alertMsg');
            const icon = document.getElementById('alertIcon');
            
            box.style.display = 'flex';
            box.className = 'auth-alert-box ' + (type === 'success' ? 'auth-alert-success' : type === 'info' ? 'auth-alert-info' : 'auth-alert-error');
            icon.className = 'fa-solid ' + (type === 'success' ? 'fa-circle-check' : type === 'info' ? 'fa-circle-info' : 'fa-circle-exclamation');
            msg.textContent = message;
        }

        function validateEmailSyntax(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        function autoFillOtp() {
            if (currentGeneratedOtp) {
                const otpInput = document.getElementById('otpInput');
                otpInput.value = currentGeneratedOtp;
                showAlert('Code ' + currentGeneratedOtp + ' auto-filled!', 'success');
            }
        }

        function startOtpTimer(durationSeconds = 600) {
            clearInterval(countdownInterval);
            let remaining = durationSeconds;
            const timerSpan = document.getElementById('timerCountdown');
            const resendBtn = document.getElementById('btnResendOtp');
            if (resendBtn) resendBtn.disabled = true;

            countdownInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timerSpan.textContent = 'Expired';
                    if (resendBtn) resendBtn.disabled = false;
                } else {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    timerSpan.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        async function handleSendOtp() {
            const emailInput = document.getElementById('emailInput');
            const fullNameInput = document.getElementById('fullNameInput');
            const btn = document.getElementById('btnSendOtp');
            const btnText = document.getElementById('btnSendOtpText');
            const btnIcon = document.getElementById('btnSendOtpIcon');
            const otpSection = document.getElementById('otpSection');
            const otpInput = document.getElementById('otpInput');
            const otpDisplayBanner = document.getElementById('otpDisplayBanner');
            const liveOtpValue = document.getElementById('liveOtpValue');

            const email = emailInput.value.trim();
            const fullName = fullNameInput ? fullNameInput.value.trim() : '';

            if (!email) {
                showAlert('Please enter your email address first.', 'error');
                emailInput.focus();
                return;
            }

            if (!validateEmailSyntax(email)) {
                showAlert('Please enter a valid email format (e.g. name@domain.com).', 'error');
                emailInput.focus();
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Generating...';
            btnIcon.className = 'fa-solid fa-spinner fa-spin';
            showAlert('Generating verification code...', 'info');

            try {
                const response = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, full_name: fullName })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Show OTP section
                    otpSection.style.display = 'block';
                    otpSection.classList.add('active');
                    otpInput.required = true;

                    // If OTP was returned in the response, show it directly on page!
                    if (data.otp) {
                        currentGeneratedOtp = String(data.otp);
                        liveOtpValue.textContent = currentGeneratedOtp;
                        otpDisplayBanner.style.display = 'block';
                        
                        // Automatically fill the input field!
                        otpInput.value = currentGeneratedOtp;
                        showAlert('OTP Generated: ' + currentGeneratedOtp + ' (Auto-filled on screen)', 'success');
                    } else {
                        showAlert('Verification code sent to your email! (Check inbox & spam)', 'success');
                    }

                    startOtpTimer(600);
                    btnText.textContent = 'OTP Ready';
                    btnIcon.className = 'fa-solid fa-check';
                } else {
                    const errorDetail = data.detail || data.message || 'Failed to generate verification code.';
                    showAlert(errorDetail, 'error');
                    btn.disabled = false;
                    btnText.textContent = 'Get OTP';
                    btnIcon.className = 'fa-solid fa-paper-plane';
                }
            } catch (err) {
                showAlert('Network error connecting to server. Please try again.', 'error');
                btn.disabled = false;
                btnText.textContent = 'Get OTP';
                btnIcon.className = 'fa-solid fa-paper-plane';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            const otpInput = document.getElementById('otpInput');
            const otpSection = document.getElementById('otpSection');

            if (otpSection.style.display === 'none' || !otpInput.value.trim()) {
                e.preventDefault();
                showAlert('Please click "Get OTP" first to verify your email.', 'error');
                handleSendOtp();
            }
        });
    </script>
</body>
</html>
